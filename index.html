<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Website</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <nav>

        <div id="top-nav">

            <h1>Recipe Viewer</h1>

            <button id="burger-button">
                <img
                    id="burger-button-img"
                    src="images/burger button.png"
                    alt="Menu"
                >
            </button>

        </div>

        <div id="bottom-nav">

            <a href="index.html">
                <h2>Home</h2>
            </a>

            <a href="add.html">
                <h2>Add</h2>
            </a>

            <form>
                <input type="text">
                <button type="submit">Search</button>
            </form>

        </div>

    </nav>

    <div id="show-recipe">
            <h2 id="show-recipe-name"></h2>
            <img id="show-recipe-image" src="" alt="">
            <h3 id="show-recipe-description"></h3>
            <h3>Ingredients</h3>
            <ul id="show-recipe-ingredients"></ul>
            <h3>Instructions</h3>
            <ol id="show-recipe-instructions"></ol>
            <button id="close-recipe">Close</button>
    </div>
    <main>
        <div id="food-preview">
            <div class="recipe-image"><img class="food-preview-img" loading="lazy" src="images/mains/Cheesy Chicken Wraps.JPG" alt="cheesy-chicken-wraps"></div>
            <div class="recipe-image"><img class="food-preview-img" loading="lazy" src="images/starters/Mozzarella Triangles.jpg" alt="mozzarella-triangles"></div>
            <div class="recipe-image"><img class="food-preview-img" loading="lazy" src="images/mains/Chicken Broccoli Pasta Bake.JPG" alt="Chicken Broccoli Pasta Bake"></div>
            <div class="recipe-image"><img class="food-preview-img" loading="lazy" src="images/mains/Cajun Chicken Alfredo with Broccoli.JPG" alt="Cajun Chicken Alfredo with Broccoli"></div>
            <div class="recipe-image"><h2 id="sub-title">Recipe Viewer</h2></div>
            <div class="recipe-image"><img class="food-preview-img" loading="lazy" src="images/mains/Chicken Parmesan Calzone.jpg" alt="Chicken Parmesan Calzone"></div>
            <div class="recipe-image"><img class="food-preview-img" loading="lazy" src="images/deserts/Scooby Snacks.jpg" alt="Scooby Snacks"></div>
            <div class="recipe-image"><img class="food-preview-img" loading="lazy" src="images/mains/Garlic Butter Chicken Pasta.jpg" alt="Garlic Butter Chicken Pasta"></div>
            <div class="recipe-image"><img class="food-preview-img" loading="lazy" src="images/deserts/Smartie Brownie Cookies.JPG" alt="Smartie Brownie Cookies"></div>
        </div>

        <div id="food-carrossel-display">
            <div class="food-section">
                <h2>Starters</h2>
                <div id="starters" class="food-carrossel">
                    <button class="rotate-btn rwd" data-type="Starters">&lt;</button>
                    <img class="food-img" id="starter-img" src="" alt="">
                    <button class="rotate-btn fwd" data-type="Starters">&gt;</button>
                </div>
                <h3>Mozzarella Triangles</h3>
            </div>
            <div class="food-section">
                <h2>Mains</h2>
                <div id="mains" class="food-carrossel">
                    <button class="rotate-btn rwd" data-type="Mains">&lt;</button>
                    <img class="food-img" id="main-img" src="" alt="">
                    <button class="rotate-btn fwd" data-type="Mains">&gt;</button>
                </div>
                <h3>Garlic Butter Chicken Pasta</h3>
            </div>
            <div class="food-section">
                <h2>Deserts</h2>
                <div id="deserts" class="food-carrossel">
                    <button class="rotate-btn rwd" data-type="Deserts">&lt;</button>
                    <img class="food-img" id="desert-img" src="" alt="">
                    <button class="rotate-btn fwd" data-type="Deserts">&gt;</button>
                </div>
                <h3>Scooby Snacks</h3>
            </div>
        </div>
    </main>
    <footer>
        <h4 id="footer-text"></h4>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        let today = new Date().getFullYear();
        $("#footer-text").text(`Niall Booth - ${today}`)
    </script>
    <script src="main.js" type="module"></script>
</body>
</html>
